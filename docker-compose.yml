# Local infrastructure. The users-db instance is dedicated to workspace
# accounts, sessions, and project permissions — deliberately separate from the
# cost-data platform's PostgreSQL (which arrives with its own migrations and
# role structure on the cost-data branch).
services:
  users-db:
    image: postgres:16-alpine
    container_name: klave-users-db
    environment:
      POSTGRES_USER: klave_users
      POSTGRES_PASSWORD: klave
      POSTGRES_DB: klave_users
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - klave-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klave_users -d klave_users"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  klave-users-data:
