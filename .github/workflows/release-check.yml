name: Verify and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: klave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      users-db:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: klave_users
          POSTGRES_PASSWORD: klave
          POSTGRES_DB: klave_users
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klave_users -d klave_users"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KLAVE_LOAD_DOTENV: '0'
      UV_PYTHON: '3.12'
      NEXT_TELEMETRY_DISABLED: '1'
      PILOT_TEST_POSTGRES_URL: postgresql://klave_users:klave@127.0.0.1:5433/klave_users
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.24'
      - run: uv sync --frozen
      - name: Use trusted HTTPS Ubuntu mirror for runner dependencies
        run: |
          set -euo pipefail
          # The hosted runner's Azure mirror repeatedly stalled font/library
          # downloads. Select its official HTTPS fallback; apt signatures stay on.
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-klave-ci-network > /dev/null
      - name: Install matching PostgreSQL archive verifier
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - run: npm --prefix apps/web ci
      - name: Install Chromium and system dependencies
        timeout-minutes: 10
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Create synthetic release configuration
        run: |
          cat > /tmp/klave-ci.env <<'ENV'
          KLAVE_DOMAIN=pilot.example.mx
          KLAVE_ACME_EMAIL=ops@pilot.example.mx
          KLAVE_USERS_DB_PASSWORD=synthetic_ci_password_0123456789abcdef
          KLAVE_REGISTRATION=invite_only
          ENV
      - run: make release-check ENV_FILE=/tmp/klave-ci.env

  deploy:
    permissions:
      contents: read
      id-token: write
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: KLAVE_ENV
      url: https://www.klave.space
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: '64.7.0'
      KLAVE_LOAD_DOTENV: '0'
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ubuntu
      # Hosted runners cannot reach the server's SSH ingress, so the operator
      # releases the API by hand (deploy/ec2-release.sh). The repository
      # variable EC2_DEPLOY_MODE switches CI on: `ssh` once a runner can reach
      # port 22, or `ssm` to tunnel SSH through Session Manager (needs the
      # AWS_DEPLOY_ROLE_ARN, AWS_REGION, AWS_ACCOUNT_ID and EC2_INSTANCE_ID
      # variables). Unset, it stays `manual`.
      EC2_DEPLOY_MODE: ${{ vars.EC2_DEPLOY_MODE || 'manual' }}
      EC2_TRANSPORT: ${{ vars.EC2_DEPLOY_MODE == 'ssm' && 'ssm' || 'ssh' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Authenticate to AWS with repository-scoped OIDC
        if: env.EC2_DEPLOY_MODE == 'ssm'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: klave-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Install pinned official Session Manager plugin
        if: env.EC2_DEPLOY_MODE == 'ssm'
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/session-manager-plugin.deb"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 90 \
            https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.896.0/ubuntu_64bit/session-manager-plugin.deb --output "$package"
          printf '%s  %s\n' '53f51fcc67314a4bf85888a38a3967cd41f8d0f28a60a9469a63acf935ba713e' "$package" | sha256sum --check --status
          sudo dpkg -i "$package"
          session-manager-plugin --version
      - name: Preflight approved SSM and SSH transport
        if: env.EC2_DEPLOY_MODE == 'ssm'
        run: python3 deploy/transport_check.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Install deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production frontend configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production frontend
        run: vercel build --prod
      - name: Stage production frontend
        id: stage
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --skip-domain --yes > "$RUNNER_TEMP/vercel-stage.txt"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const output = readFileSync(process.env.RUNNER_TEMP + '/vercel-stage.txt', 'utf8');
          let value;
          try { value = JSON.parse(output).deployment?.url; } catch {}
          if (!value) value = output.trim();
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.origin !== value || !url.hostname.endsWith('.vercel.app')) {
            throw new Error('Unexpected deployment URL');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + value + '\n');
          JS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify staged frontend
        run: vercel curl /bienvenida --deployment "$DEPLOYMENT_URL" -- --fail --silent --show-error --output /dev/null
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Prepare SSH credentials
        if: env.EC2_DEPLOY_MODE == 'ssh' || env.EC2_DEPLOY_MODE == 'ssm'
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" && test -n "$EC2_HOST"
          install -d -m 700 "$RUNNER_TEMP/klave-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/klave-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/klave-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/klave-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/klave-ssh/key" > /dev/null
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
      - name: Back up and deploy tested API commit
        if: env.EC2_DEPLOY_MODE == 'ssh' || env.EC2_DEPLOY_MODE == 'ssm'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/klave-release-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz -o "$archive" HEAD \
            apps/api apps/__init__.py packages pyproject.toml uv.lock README.md \
            .dockerignore docker-compose.ec2.yml deploy
          options=(-i "$RUNNER_TEMP/klave-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/klave-ssh/known_hosts" -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          if test "$EC2_DEPLOY_MODE" = ssm; then
            options=(-o "ProxyCommand=python3 deploy/ssm_proxy.py" "${options[@]}")
          fi
          scp "${options[@]}" "$archive" "$EC2_USER@$EC2_HOST:klave-release-$GITHUB_SHA.tar.gz"
          ssh "${options[@]}" "$EC2_USER@$EC2_HOST" "bash -s -- '$GITHUB_SHA' \"\$HOME/klave-release-$GITHUB_SHA.tar.gz\"" < deploy/ec2-release.sh
      - name: Record manual API release
        if: env.EC2_DEPLOY_MODE != 'ssh' && env.EC2_DEPLOY_MODE != 'ssm'
        run: |
          {
            echo '### API not deployed by CI'
            echo "EC2_DEPLOY_MODE is \`$EC2_DEPLOY_MODE\`: the frontend ships against the API already running."
            echo "Release \`$GITHUB_SHA\` to EC2 with deploy/ec2-release.sh when it changes the backend."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public API
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://api.klave.space/ready
      - name: Promote tested frontend
        # `vercel promote` first asks GET /v2/user who owns the token, and this
        # project's token answers 404 «User not found». The same calls the CLI
        # makes after that lookup need only the team and project, like deploy.
        run: |
          set -euo pipefail
          api=https://api.vercel.com
          team="teamId=$VERCEL_ORG_ID"
          vercel_api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" "$@"
          }
          deployment=$(vercel_api "$api/v13/deployments/${DEPLOYMENT_URL#https://}?$team")
          id=$(jq -r .id <<<"$deployment")
          if [ "$(jq -r .projectId <<<"$deployment")" != "$VERCEL_PROJECT_ID" ] \
            || [ "$(jq -r .target <<<"$deployment")" != production ]; then
            echo "$DEPLOYMENT_URL is not a production deployment of this project." >&2
            exit 1
          fi
          status=$(vercel_api -X POST -o /dev/null -w '%{http_code}' \
            "$api/v10/projects/$VERCEL_PROJECT_ID/promote/$id?$team")
          if [ "$status" = 202 ]; then
            echo "Promotion of $id queued behind an active rolling release."
            exit 0
          fi
          # The CLI's own wait (promoteStatus): no recent alias job means Vercel
          # already applied it; otherwise wait for succeeded, skipped or failed.
          recent=$(( ($(date +%s) - 180) * 1000 ))
          for _ in $(seq 60); do
            job=$(vercel_api "$api/v9/projects/$VERCEL_PROJECT_ID?$team" | jq -c '.lastAliasRequest')
            echo "Alias job: $job"
            state=$(jq -r --argjson recent "$recent" '
              if (.jobStatus and .requestedAt and .toDeploymentId | not)
                or .requestedAt < $recent then "applied"
              else .jobStatus end' <<<"$job")
            case "$state" in
              applied|succeeded|skipped) echo "Promoted $id."; exit 0 ;;
              failed) echo "Vercel reports the promotion failed." >&2; exit 1 ;;
              pending|in-progress) sleep 3 ;;
              *) echo "Unknown promotion status «$state»." >&2; exit 1 ;;
            esac
          done
          echo "The promotion of $id did not finish within 3 minutes." >&2
          exit 1
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify public frontend
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --output /dev/null https://www.klave.space/bienvenida
      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/klave-ssh"
