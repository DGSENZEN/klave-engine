name: Verify and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: klave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      users-db:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: klave_users
          POSTGRES_PASSWORD: klave
          POSTGRES_DB: klave_users
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klave_users -d klave_users"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KLAVE_LOAD_DOTENV: '0'
      UV_PYTHON: '3.12'
      NEXT_TELEMETRY_DISABLED: '1'
      PILOT_TEST_POSTGRES_URL: postgresql://klave_users:klave@127.0.0.1:5433/klave_users
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.24'
      - run: uv sync --frozen
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - name: Create synthetic release configuration
        run: |
          cat > /tmp/klave-ci.env <<'ENV'
          KLAVE_DOMAIN=pilot.example.mx
          KLAVE_ACME_EMAIL=ops@pilot.example.mx
          KLAVE_USERS_DB_PASSWORD=synthetic_ci_password_0123456789abcdef
          KLAVE_REGISTRATION=invite_only
          ENV
      - run: make release-check ENV_FILE=/tmp/klave-ci.env

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: KLAVE_ENV
      url: https://www.klave.space
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: '64.7.0'
      KLAVE_LOAD_DOTENV: '0'
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ubuntu
      # Hosted runners cannot reach the server's SSH ingress, so the operator
      # releases the API by hand (deploy/ec2-release.sh). Set the repository
      # variable EC2_DEPLOY_MODE=ssh once a runner can reach port 22 again.
      EC2_DEPLOY_MODE: ${{ vars.EC2_DEPLOY_MODE || 'manual' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - name: Install deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production frontend configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production frontend
        run: vercel build --prod
      - name: Stage production frontend
        id: stage
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --skip-domain --yes > "$RUNNER_TEMP/vercel-stage.txt"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const output = readFileSync(process.env.RUNNER_TEMP + '/vercel-stage.txt', 'utf8');
          let value;
          try { value = JSON.parse(output).deployment?.url; } catch {}
          if (!value) value = output.trim();
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.origin !== value || !url.hostname.endsWith('.vercel.app')) {
            throw new Error('Unexpected deployment URL');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + value + '\n');
          JS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify staged frontend
        run: vercel curl /bienvenida --deployment "$DEPLOYMENT_URL" -- --fail --silent --show-error --output /dev/null
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Prepare SSH credentials
        if: env.EC2_DEPLOY_MODE == 'ssh'
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" && test -n "$EC2_HOST"
          install -d -m 700 "$RUNNER_TEMP/klave-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/klave-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/klave-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/klave-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/klave-ssh/key" > /dev/null
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
      - name: Back up and deploy tested API commit
        if: env.EC2_DEPLOY_MODE == 'ssh'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/klave-release-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz -o "$archive" HEAD \
            apps/api apps/__init__.py packages pyproject.toml uv.lock README.md \
            .dockerignore docker-compose.ec2.yml deploy
          options=(-i "$RUNNER_TEMP/klave-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/klave-ssh/known_hosts" -o ConnectTimeout=15)
          scp "${options[@]}" "$archive" "$EC2_USER@$EC2_HOST:klave-release-$GITHUB_SHA.tar.gz"
          ssh "${options[@]}" "$EC2_USER@$EC2_HOST" "bash -s -- '$GITHUB_SHA' \"\$HOME/klave-release-$GITHUB_SHA.tar.gz\"" < deploy/ec2-release.sh
      - name: Record manual API release
        if: env.EC2_DEPLOY_MODE != 'ssh'
        run: |
          {
            echo '### API not deployed by CI'
            echo "EC2_DEPLOY_MODE is \`$EC2_DEPLOY_MODE\`: the frontend ships against the API already running."
            echo "Release \`$GITHUB_SHA\` to EC2 with deploy/ec2-release.sh when it changes the backend."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public API
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://api.klave.space/ready
      - name: Promote tested frontend
        # `vercel promote` first asks GET /v2/user who owns the token, and this
        # project's token answers 404 «User not found». The same calls the CLI
        # makes after that lookup need only the team and project, like deploy.
        run: |
          set -euo pipefail
          api=https://api.vercel.com
          team="teamId=$VERCEL_ORG_ID"
          vercel_api() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" "$@"
          }
          deployment=$(vercel_api "$api/v13/deployments/${DEPLOYMENT_URL#https://}?$team")
          id=$(jq -r .id <<<"$deployment")
          if [ "$(jq -r .projectId <<<"$deployment")" != "$VERCEL_PROJECT_ID" ] \
            || [ "$(jq -r .target <<<"$deployment")" != production ]; then
            echo "$DEPLOYMENT_URL is not a production deployment of this project." >&2
            exit 1
          fi
          status=$(vercel_api -X POST -o /dev/null -w '%{http_code}' \
            "$api/v10/projects/$VERCEL_PROJECT_ID/promote/$id?$team")
          if [ "$status" = 202 ]; then
            echo "Promotion of $id queued behind an active rolling release."
            exit 0
          fi
          # As the CLI does: wait for the project's alias job to name this deployment.
          for _ in $(seq 60); do
            job=$(vercel_api "$api/v9/projects/$VERCEL_PROJECT_ID?$team" \
              | jq -r '.lastAliasRequest // {} | "\(.toDeploymentId) \(.jobStatus)"')
            case "$job" in
              "$id succeeded") echo "Promoted $id."; exit 0 ;;
              "$id failed") echo "Vercel reports the promotion of $id failed." >&2; exit 1 ;;
            esac
            sleep 3
          done
          echo "The promotion of $id did not finish within 3 minutes." >&2
          exit 1
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify public frontend
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --output /dev/null https://www.klave.space/bienvenida
      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/klave-ssh"
