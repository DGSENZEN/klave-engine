<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Canon</title><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;color:#111827}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-bottom:1px solid #e5e7eb}.brand{font-weight:700;font-size:24px}.b{background:#2563eb;color:#fff;padding:12px 18px;border-radius:8px;font-size:15px}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;padding:90px 64px}
h1{font-size:64px;line-height:1.05;font-weight:700;letter-spacing:-.03em}p{margin-top:24px;font-size:19px;line-height:1.5;color:#4b5563}
.ctas{margin-top:36px;display:flex;gap:12px}.g{border:1px solid #d1d5db;padding:12px 18px;border-radius:8px;font-size:15px}
.shot{height:520px;border-radius:14px;border:1px solid #e5e7eb;box-shadow:0 30px 60px -20px rgba(0,0,0,.18);background:linear-gradient(#f9fafb,#f3f4f6);padding:20px}
.row{height:26px;margin:12px 0;background:#e5e7eb;border-radius:4px}
</style></head><body><nav><div class="brand">Klave</div><span class="b">Crear cuenta</span></nav>
<div class="hero"><div><h1>Presupuestos de obra a partir de tus planos</h1><p>Lee DWG/DXF y genera generadores de obra negra listos para OPUS y Neodata.</p><div class="ctas"><span class="b">Crear cuenta</span><span class="g">Entrar</span></div></div>
<div class="shot"><div class="row" style="width:60%"></div><div class="row"></div><div class="row"></div><div class="row" style="width:80%"></div><div class="row"></div><div class="row" style="width:70%"></div></div></div>
</body></html>
