<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Swiss</title><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fbfbf9;font-family:"Helvetica Neue",Arial,sans-serif;color:#0d0d0d;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(8,1fr);gap:0 24px;padding:40px 48px}
.brand{grid-column:1/4;grid-row:1;font-size:28px;font-weight:700}.nav{grid-column:9/13;grid-row:1;display:flex;justify-content:flex-end;gap:24px;font-size:14px}
h1{grid-column:1/8;grid-row:2/6;font-size:120px;line-height:.9;font-weight:700;letter-spacing:-.045em;align-self:end}
.bars{grid-column:8/13;grid-row:2/8;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.bar{height:44px;background:#0d0d0d}.bar.on{background:#1636d8}
.sub{grid-column:1/6;grid-row:6/7;font-size:19px;line-height:1.45;align-self:center}
.cta{grid-column:1/4;grid-row:7/8;align-self:center;background:#0d0d0d;color:#fff;padding:20px 24px;font-size:18px;font-weight:700}
</style></head><body><div class="brand">Klave</div><div class="nav"><span>Método</span><span>Entrar</span></div>
<h1>Planos que se convierten en números.</h1>
<div class="bars"><div class="bar" style="width:92%"></div><div class="bar" style="width:64%"></div><div class="bar on" style="width:78%"></div><div class="bar" style="width:41%"></div><div class="bar" style="width:57%"></div><div class="bar" style="width:30%"></div></div>
<p class="sub">Generadores de obra negra leídos del DWG, listos para OPUS y Neodata.</p><div class="cta">Crear cuenta</div>
</body></html>
